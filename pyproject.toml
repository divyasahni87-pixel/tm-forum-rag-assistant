[project]
name = "telco-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Divya Sahni", email = "divyasahni87@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-opendataloader-pdf>=2.0.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pinecone>=9.1.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]

[project.scripts]
telco-rag = "telco_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
